name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A655CA: ${{ secrets.A655CA }}
          BBD6B8: ${{ secrets.BBD6B8 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A655CA', '')
          meta_b = os.environ.get('BBD6B8', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 0dbeac12164dd3c2ea1e78d1126a92b2814c -->', meta_a)
          if meta_b:
              out = out.replace('<!-- f815b16292ec16c763a21ae5e3c6641ddef27276947c38 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
